<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cálculo de prazo Inteligente</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="pagina">
    <div class="container">
      <h1>Cálculo de prazo Inteligente</h1>

      <label for="dataInicial">Data Inicial</label>
      <div class="input-wrapper">
        <input type="date" id="dataInicial" />
        <span class="calendar-icon">📅</span>
      </div>

      <label for="dias">Quantidade de Dias</label>
      <input type="number" id="dias" placeholder="Ex: 20" min="1" />

      <button onclick="calcularPrazo()">CALCULAR PRAZO</button>
      <button class="btn-limpar" onclick="limparCampos()">LIMPAR</button>

      <div class="resultado" id="resultado">
        <span>Data final:</span>
        <strong id="dataFinal">—</strong>
      </div>
    </div>

    <footer>
      © 2026 Todos os direitos reservados — Criado por José Everaldo de Andrade Santana
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
